[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "endpaper"
dynamic = ["version"]
description = "A corporate-friendly Markdown notes engine that makes your AI happy."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "textual>=8.2",
    "PyYAML>=6.0",
]

[project.scripts]
endpaper = "endpaper.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # The suite is dominated by Textual's message pump, not by CPU -- it is ~75%
    # idle, so it parallelises almost linearly. CI passes `-n auto`; local runs
    # stay serial by default so failure output remains readable.
    "pytest-xdist",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# enable-by-default = false so `pip install -e .` (an editable/dev install) does not stamp a
# dev-version _version.py, which would defeat the 0.0.0-from-a-checkout guarantee (FR-043). Real
# builds opt in with HATCH_BUILD_HOOKS_ENABLE=1 (see publish.yml, release-dry-run.yml).
[tool.hatch.build.hooks.vcs]
version-file = "src/endpaper/_version.py"
enable-by-default = false

[tool.hatch.build.targets.wheel]
packages = ["src/endpaper"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["specs", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "core must stay adapter-agnostic; argparse belongs in cli/"
"textual".msg = "core must stay adapter-agnostic; textual belongs in tui/"
"rich".msg = "core must stay adapter-agnostic; rich belongs in tui/"

[tool.ruff.lint.per-file-ignores]
"src/endpaper/cli/*" = ["TID251"]
"src/endpaper/tui/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["performance: has a real time budget to protect"]
