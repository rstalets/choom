[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "choom"
dynamic = ["version"]
description = "A corporate-friendly Markdown notes engine that makes your AI happy."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "textual==8.2.8",
    "PyYAML==6.0.3",
]

[project.scripts]
choom = "choom.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # The suite is dominated by Textual's message pump, not by CPU -- each worker
    # is mostly idle, so CI and scripts/dev-tests.sh both oversubscribe to ~2x the
    # core count (beats `-n auto`'s 1x; measured on both a workstation and CI
    # runners). A bare `pytest` invocation stays serial, which is useful for
    # readable failure output when debugging a single test.
    "pytest-xdist==3.8.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
]

[tool.uv]
# Supply-chain hardening: refuse to resolve any package version published less
# than 48 hours ago, giving the community a window to catch and yank bad
# releases before they land here (see issue #28).
exclude-newer = "48 hours"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# enable-by-default = false so `pip install -e .` (an editable/dev install) does not stamp a
# dev-version _version.py, which would defeat the 0.0.0-from-a-checkout guarantee (FR-043). Real
# builds opt in with HATCH_BUILD_HOOKS_ENABLE=1 (see publish.yml, release-dry-run.yml).
[tool.hatch.build.hooks.vcs]
version-file = "src/choom/_version.py"
enable-by-default = false

[tool.hatch.build.targets.wheel]
packages = ["src/choom"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["specs", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "core must stay adapter-agnostic; argparse belongs in cli/"
"textual".msg = "core must stay adapter-agnostic; textual belongs in tui/"
"rich".msg = "core must stay adapter-agnostic; rich belongs in tui/"

[tool.ruff.lint.per-file-ignores]
"src/choom/cli/*" = ["TID251"]
"src/choom/tui/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["performance: has a real time budget to protect"]
