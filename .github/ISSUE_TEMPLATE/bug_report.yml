name: "🐛 Bug Report"
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you can
        give, the faster this can be diagnosed and fixed.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Check for existing issues
      description: Please search open and closed issues before filing to avoid duplicates.
      options:
        - label: I searched existing issues and didn't find one already open for this
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can someone else reproduce this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version, commit, or release are you using?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime version, or other relevant environment details.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, stack traces, related issues/PRs, etc.
    validations:
      required: false
