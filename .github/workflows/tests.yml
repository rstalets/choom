name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, plus a current release. The floor is
        # not theoretical: a Path.read_text(newline=) call has already broken
        # 3.11 once.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Format check
        run: uv run --extra dev ruff format --check .

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Type check
        run: uv run --extra dev mypy

      - name: Test
        run: uv run --extra dev pytest -q -n auto --durations=10
