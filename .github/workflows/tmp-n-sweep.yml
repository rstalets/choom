name: TMP n-sweep

on:
  push:
    branches: [worktree-parallelize-tests]

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [4, 8, 12, 16, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: nproc
        run: nproc

      - name: Test -n ${{ matrix.n }}
        run: time uv run --extra dev pytest -q -n ${{ matrix.n }}
